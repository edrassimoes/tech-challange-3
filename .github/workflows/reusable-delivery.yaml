name: Reusable Delivery

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::579097996347:role/ToggleMasterGitHubActionsRole
  REGISTRY: 579097996347.dkr.ecr.us-east-1.amazonaws.com

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: tag
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: docker build -t "$REGISTRY/${{ inputs.service }}:${{ steps.tag.outputs.tag }}" ${{ inputs.service }}-main
      - name: Container Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REGISTRY }}/${{ inputs.service }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.1
      - if: env.IS_MAIN == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - if: env.IS_MAIN == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
      - name: Push
        if: env.IS_MAIN == 'true'
        run: docker push "$REGISTRY/${{ inputs.service }}:${{ steps.tag.outputs.tag }}"

  gitops:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Update image tag
        run: |
          yq -i '.spec.template.spec.containers[0].image = "${{ env.REGISTRY }}/${{ inputs.service }}:${{ needs.docker.outputs.tag }}"' gitops/${{ inputs.service }}/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/${{ inputs.service }}/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza a imagem do ${{ inputs.service }} para ${{ needs.docker.outputs.tag }}"
          git pull --rebase origin main
          git push origin main
