name: flag-service

on:
  push:
    branches: [main]
    paths:
      - flag-service-main/**
      - .github/workflows/flag-service.yaml
      - .github/workflows/reusable-python.yaml
      - .github/workflows/reusable-delivery.yaml
  pull_request:
    paths:
      - flag-service-main/**
      - .github/workflows/flag-service.yaml
      - .github/workflows/reusable-python.yaml
      - .github/workflows/reusable-delivery.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/reusable-python.yaml
    with:
      service: flag-service

  delivery:
    needs: ci
    uses: ./.github/workflows/reusable-delivery.yaml
    permissions:
      contents: write
      id-token: write
    with:
      service: flag-service
